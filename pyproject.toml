[project]
name = "mysql-diag-mcp"
version = "0.2.0"
description = "Read-only, version-agnostic MySQL diagnostics MCP server (5.7 through 8.4+), over SSH+CLI or direct TCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=50.0.1",
    "mcp>=1.9.0,<2",
    "pymysql>=1.2.3",
    "python-dotenv>=1.0.0",
]

[project.scripts]
mysql-diag-mcp = "mysql_diag_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
